name: One More Game
description: >-
  One More Game is a fully remote game development studio founded by veterans
  behind titles such as Warcraft, Diablo, StarCraft, and Guild Wars. The team
  builds delightful, social online games designed to be played with friends,
  emphasizing fast iteration and a mission to help players have more fun. One
  More Game was surfaced as a portfolio company of Lightspeed Venture Partners
  and added to the API Evangelist network. The studio publishes a consumer
  gaming website, a company blog, careers listings, and a GitHub organization
  (PlayOneMoreGame) of game-development tooling and forks, but does not currently
  operate a public developer API, SDK, or documentation surface.
